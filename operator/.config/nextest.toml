# The operator project's nextest config (scripts/operator.sh passes it).
# The slow-timeout is the shared one in the repository's
# .config/nextest.toml; keep the two equal. The test group cannot live in
# the shared file: nextest rejects an override whose `binary(...)` matches
# no binary, and the core workspace and the plugins have no controllers_it.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# The controller tests each start a kube-apiserver and etcd of their own
# (nextest runs a test per process; tests/support/envtest.rs): some
# 300 MiB and 8–12 s apiece. Four at a time keeps a laptop and a CI runner
# inside their memory.
[test-groups]
envtest = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(controllers_it) | binary(plugins_it)'
test-group = 'envtest'

# The kind journey (tests/e2e_k8s.rs, `scripts/operator.sh e2e`): one test
# that waits up to 900 s for a step (an image pull, a Job, a pod's restart)
# and runs the whole of Phase 3, so the default profile's 180 s would kill
# an honest run. 45 periods of 60 s is 45 minutes, inside the CI job's
# budget; a hung journey still fails instead of waiting for the job's limit.
[profile.e2e-k8s]
slow-timeout = { period = "60s", terminate-after = 45 }
