[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/balerix-ai/balerix"
# balerix-api and balerix-plugin-sdk are published to crates.io at this
# version (Spec I §3); every other crate sets `publish = false`. A published
# crate's path dependencies need a version, so those two entries carry one,
# and scripts/release/prepare.sh moves it with the workspace version.
publish = false

[workspace.dependencies]
balerix-api = { path = "crates/balerix-api", version = "0.2.0" }
balerix-core = { path = "crates/balerix-core" }
balerix-config = { path = "crates/balerix-config" }
balerix-plugin-sdk = { path = "crates/balerix-plugin-sdk", version = "0.2.0" }
balerix-runtime = { path = "crates/balerix-runtime" }
balerix-server = { path = "crates/balerix-server" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_norway = "0.9.42"
thiserror = "2.0.20"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
sha2 = "0.11.0"
hex = "0.4.3"
toml = "1.1.5"
tar = "0.4.46"
flate2 = "1.1.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { version = "0.8.9", features = ["ws"] }
ureq = { version = "3.4.1", default-features = false, features = ["json"] }
# Async loopback HTTP for the daemon → plugin calls and the plugin SDK
# (plugins spec §16.1). No TLS provider, no HTTP/2, no proxy discovery.
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
# Phase 3 (plugins spec §18.1). hyper, hyper-util and futures-util were
# already in the lock through axum and reqwest and are direct, exact
# dependencies now: the proxy is a plain reverse proxy on hyper's legacy
# client (upgrades passed through as bytes), and the SDK's stream clients
# need Sink/Stream adaptors. tokio-tungstenite (no TLS feature, P3-1) is
# the WebSocket client for the SDK and the tests.
hyper = { version = "1.11.1", features = ["http1", "client"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30.0"
# AgentRunner::attach on tmux (plugins spec §18.4): a PTY for the tmux
# client. The workspace forbids `unsafe`, so the setsid/TIOCSCTTY dance a
# hand-rolled pre_exec would need lives in this crate instead.
portable-pty = "0.9.0"
prometheus = "0.14.0"
chacha20poly1305 = "0.11.0"
rand = "0.10.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# dev
insta = { version = "1.48.0", features = ["yaml", "json"] }
proptest = "1.11.0"
proptest-state-machine = "0.8.0"
tempfile = "3.27.0"
pretty_assertions = "1.4.1"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
strip = true
