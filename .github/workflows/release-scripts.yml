name: release-scripts
# The release scripts' own tests (Spec I §10), whenever they could change.
on:
  push:
    branches: [main]
    paths:
      - scripts/release/**
      - scripts/plugin.sh
      - cliff.toml
      - charts/**
      - mise.toml
      - .github/workflows/release-scripts.yml
  pull_request:
    paths:
      - scripts/release/**
      - scripts/plugin.sh
      - cliff.toml
      - charts/**
      - mise.toml
      - .github/workflows/release-scripts.yml
# Superseded pull request runs are cancelled (see ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions: {}
env:
  MISE_AUTO_INSTALL: "false"
jobs:
  release-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18
          install: false
          cache: true
      - run: mise install rust jq git-cliff shellcheck
      - run: mise install cargo:cargo-edit
      - run: mise run release-test
