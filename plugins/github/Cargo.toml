# A standalone project, not a workspace member (Spec H): its TLS and
# HTTP tree stays out of the daemon's feature resolution.
[workspace]
resolver = "3"

[package]
name = "balerix-plugin-github"
description = "The GitHub plugin: a mention of a GitHub App on an issue or pull request starts an agent whose session is that issue (Spec M)"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/balerix-ai/balerix"
publish = false

[[bin]]
name = "balerix-plugin-github"
path = "src/main.rs"

[dependencies]
balerix-api = { path = "../../crates/balerix-api" }
balerix-plugin-sdk = { path = "../../crates/balerix-plugin-sdk" }
balerix-plugin-common = { path = "../common" }
# The GitHub REST client: ten endpoints, TLS through rustls (M-12).
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
# The App JWT (RS256) that mints installation tokens. `aws_lc_rs` picks
# the crypto backend jsonwebtoken 11 now requires explicitly; reqwest's
# rustls already pulls aws-lc-rs, so this reuses it rather than adding
# the pure-Rust `rust_crypto` backend's own dependency tree.
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
# Webhook signatures: HMAC-SHA256 over the raw body.
hmac = "0.13.0"
sha2 = "0.11.0"
# `contents` API bodies are base64.
base64 = "0.23.1"
# `.balerix.yaml` is parsed here (the core's YAML crate).
serde_norway = "0.9.42"
# The webhook listener; already in the SDK's tree.
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["yaml", "json"] }
# `test-util` gives the actor's delivery-window and status-coalescing tests
# a paused, advanceable clock (`tokio::time::advance`); cargo unifies it
# into the same tokio already in `[dependencies]`, so nothing new is
# pulled in for the built binary.
tokio = { version = "1.53.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
strip = true
