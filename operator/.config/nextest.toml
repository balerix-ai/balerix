# The operator project's nextest config (scripts/operator.sh passes it).
# The slow-timeout is the shared one in the repository's
# .config/nextest.toml; keep the two equal. The test group cannot live in
# the shared file: nextest rejects an override whose `binary(...)` matches
# no binary, and the core workspace and the plugins have no controllers_it.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# The controller tests each start a kube-apiserver and etcd of their own
# (nextest runs a test per process; tests/support/envtest.rs): some
# 300 MiB and 8–12 s apiece. Four at a time keeps a laptop and a CI runner
# inside their memory.
[test-groups]
envtest = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(controllers_it)'
test-group = 'envtest'
