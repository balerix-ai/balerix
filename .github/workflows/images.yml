name: images
# Builds, smoke-tests and scans every unit's image on both architectures
# without pushing, so a Dockerfile or tool-pin break shows up before release
# day (Spec I §6.5).
on:
  pull_request:
    paths:
      - docker/**
      - mise.toml
      - .hadolint.yaml
      - .trivyignore.yaml
      - scripts/release/**
      - .github/actions/**
      - .github/workflows/images.yml
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
permissions: {}
env:
  MISE_AUTO_INSTALL: "false"
jobs:
  image:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unit: [core, flow, web, matrix]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: true
      - run: mise install rust jq hadolint trivy
      - id: build
        uses: ./.github/actions/build-binary
        with:
          unit: ${{ matrix.unit }}
          target: ${{ matrix.target }}
      - uses: ./.github/actions/build-image
        with:
          unit: ${{ matrix.unit }}
          dist: ${{ steps.build.outputs.dist }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
