apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "balerix-operator.labels" . | nindent 4 }}
spec:
  # one replica, no leader election (Spec O §21.1): a rolling update would
  # run two reconcilers for a moment
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "balerix-operator.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "balerix-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            {{- with .Values.watchNamespaces }}
            - --watch-namespaces
            - {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.images.daemon }}
            - --daemon-image
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.images.agent }}
            - --agent-image
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
