apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plugins.balerix.ai
spec:
  group: balerix.ai
  names:
    kind: Plugin
    plural: plugins
    singular: plugin
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PluginSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A plugin a Daemon in its namespace may list (Spec O §4.5). Defined
              here so the five kinds are reviewed once; its controller is
              sub-project 4, and until then a Daemon that lists any plugin is
              `PluginsReady=False`, reason `PluginsUnsupported` (§20.2).
            properties:
              config:
                default: {}
                type: object
                x-kubernetes-preserve-unknown-fields: true
              expose:
                description: A Service for the plugin's own listener.
                nullable: true
                properties:
                  port:
                    format: int32
                    type: integer
                required:
                - port
                type: object
              fleetDefaults:
                default: {}
                type: object
                x-kubernetes-preserve-unknown-fields: true
              image:
                type: string
              needs:
                default: []
                description: The grant.
                items:
                  type: string
                type: array
              resources:
                default: {}
                type: object
                x-kubernetes-preserve-unknown-fields: true
              scratch:
                description: A claim for the plugin's scratch directory.
                nullable: true
                properties:
                  size:
                    type: string
                required:
                - size
                type: object
              secrets:
                additionalProperties:
                  properties:
                    key:
                      type: string
                    secretName:
                      type: string
                  required:
                  - key
                  - secretName
                  type: object
                default: {}
                description: Config key to the Secret key injected there.
                type: object
            required:
            - image
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: Plugin
        type: object
    served: true
    storage: true
    subresources:
      status: {}
