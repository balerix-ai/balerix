name: release
# Releases every unit whose manifest version has no tag yet and has its
# changelog section (Spec I §5). Merging a release PR is what leaves a
# version in that state, so that is what triggers a release; every job is
# safe to re-run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: >-
          Plans only units already proposed on this ref (an untagged manifest
          version with its changelog section, what a merged release PR
          leaves); on main before any release PR merges that is nothing.
          Dispatch on a unit's release/<unit> branch to rehearse it before
          merging. Builds, tests, scans and packages the planned units;
          publishes nothing.
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
env:
  # Each job installs only the tools it uses.
  MISE_AUTO_INSTALL: "false"
jobs:
  plan:
    # A real release only from main; any branch may dry-run. Every other job
    # needs plan, so all of them skip with it.
    if: ${{ github.ref == 'refs/heads/main' || inputs.dry-run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      units: ${{ steps.plan.outputs.units }}
      plugins: ${{ steps.plan.outputs.plugins }}
      binaries: ${{ steps.plan.outputs.binaries }}
      crates: ${{ steps.plan.outputs.crates }}
      images: ${{ steps.plan.outputs.images }}
      core: ${{ steps.plan.outputs.core }}
      charts: ${{ steps.plan.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq cargo:cargo-audit aqua:EmbarkStudios/cargo-deny
      - id: plan
        run: mise x -- scripts/release/plan.sh >>"$GITHUB_OUTPUT"
      - name: Audit the units being released
        if: steps.plan.outputs.units != '[]'
        env:
          UNITS: ${{ steps.plan.outputs.units }}
        run: |
          mapfile -t units < <(jq -r '.[]' <<<"$UNITS")
          mise x -- scripts/release/audit.sh "${units[@]}"

  build:
    needs: plan
    if: needs.plan.outputs.binaries != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.binaries) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq
      - id: build
        uses: ./.github/actions/build-binary
        with:
          unit: ${{ matrix.unit }}
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.unit }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.dist }}/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.unit }}-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.dist }}/*
            !${{ steps.build.outputs.dist }}/*.tar.gz
          if-no-files-found: error

  images:
    needs: [plan, build]
    if: needs.plan.outputs.binaries != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.binaries) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq hadolint trivy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.unit }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist
      - if: ${{ !inputs.dry-run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-unit-images
        with:
          unit: ${{ matrix.unit }}
          dist: ${{ runner.temp }}/dist
          push: ${{ !inputs.dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digests: ${{ runner.temp }}/digests
      - if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.unit }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error

  merge-images:
    needs: [plan, images]
    if: ${{ !inputs.dry-run && needs.plan.outputs.images != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # The attestation's storage record, for the org's linked artifacts page.
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq cosign
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.unit }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: merge
        env:
          IMAGE: ${{ matrix.image }}
        run: mise x -- scripts/release/merge-image.sh "$IMAGE" "$RUNNER_TEMP/digests/$IMAGE" >>"$GITHUB_OUTPUT"
      - name: Sign
        env:
          REF: ${{ steps.merge.outputs.image }}@${{ steps.merge.outputs.digest }}
        run: mise x -- cosign sign --yes --recursive "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.merge.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  package:
    needs: [plan, build]
    if: needs.plan.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-${{ matrix.unit }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - env:
          UNIT: ${{ matrix.unit }}
        run: mise x -- scripts/release/package.sh "$UNIT" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.unit }}
          path: ${{ runner.temp }}/package/*.tar.gz
          if-no-files-found: error

  charts:
    # Spec O §24.5 steps 1 and 2: the archives as they will be published (a
    # fork's carry its own image repositories), linted, rendered and
    # validated (§24.3), and installed on kind with the published images.
    # A run that also releases a unit the charts pin installs that unit's
    # new image tags, so it waits for merge-images to create them;
    # merge-images is skipped on a dry run and on a run with no images.
    needs: [plan, merge-images]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.charts == 'true'
      && (needs.merge-images.result == 'success' || needs.merge-images.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BALERIX_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags: which pinned versions are released already
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: >-
          mise install rust jq cargo:cargo-nextest helm@4.3.0 kind@0.33.0 kubectl@1.34.12
          github:kubernetes-sigs/controller-tools@envtest-v1.34.1
      - name: Every pin is tagged or released by this run
        env:
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          mapfile -t units < <(jq -r '.[]' <<<"$UNITS")
          mise x -- scripts/release/check-pins.sh "${units[@]}"
      - name: Package
        run: mise x helm@4.3.0 -- scripts/release/package-charts.sh "$RUNNER_TEMP/charts"
      # Uploaded before any step runs cargo-built code, which could
      # otherwise tamper with the archives on disk.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-charts-helm
          path: ${{ runner.temp }}/charts/*.tgz
          if-no-files-found: error
      - name: Lint, render and validate
        run: mise run charts
      - name: A kind cluster with the shared class
        run: mise run kind-up cluster
      - name: Install the archives with the published images
        run: mise x helm@4.3.0 kubectl@1.34.12 -- scripts/release/check-charts.sh "$RUNNER_TEMP/charts"

  charts-publish:
    # Step 3: OCI, signed by digest. Never on a dry run. charts may run
    # after a skipped merge-images, which would skip this job too without
    # !cancelled().
    needs: [plan, charts]
    if: ${{ !cancelled() && !inputs.dry-run && needs.charts.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install jq cosign helm@4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-charts-helm
          path: ${{ runner.temp }}/charts
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log helm in to ghcr
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x helm@4.3.0 -- helm registry login ghcr.io --username "$ACTOR" --password-stdin <<<"$TOKEN"
      - run: mise x helm@4.3.0 -- scripts/release/push-charts.sh "$RUNNER_TEMP/charts"

  # No environment and no OIDC: a dry run (or a fork's real run, which can
  # never publish) must never enter environment `release`.
  # A library-only run has no binaries, so build is skipped: accept that
  # explicitly, or the implicit success() skips publishing while
  # github-release still tags. With !cancelled() a failed plan no longer
  # skips these jobs by itself, hence needs.plan.result.
  publish-crates-dry-run:
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && needs.plan.outputs.crates != '[]' && (inputs.dry-run || github.repository != 'balerix-ai/balerix') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq
      - env:
          CRATES: ${{ needs.plan.outputs.crates }}
        run: |
          mapfile -t units < <(jq -r '.[]' <<<"$CRATES")
          mise x -- scripts/release/publish-crates.sh --dry-run "${units[@]}"

  publish-crates:
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && needs.plan.outputs.crates != '[]' && !inputs.dry-run && github.repository == 'balerix-ai/balerix' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ needs.plan.outputs.crates }}
        run: |
          mapfile -t units < <(jq -r '.[]' <<<"$CRATES")
          mise x -- scripts/release/publish-crates.sh "${units[@]}"

  github-release:
    # A fork's real (non-dry-run) run never runs publish-crates (repository
    # check), only publish-crates-dry-run; gate on both so that still holds
    # this job back the way the combined job used to.
    needs: [plan, build, merge-images, package, charts, charts-publish, publish-crates-dry-run, publish-crates]
    if: >-
      ${{ !cancelled() && !inputs.dry-run && needs.plan.result == 'success' && needs.plan.outputs.units != '[]'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.merge-images.result == 'success' || needs.merge-images.result == 'skipped')
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq gh
      - if: ${{ !contains(fromJSON(needs.plan.outputs.crates), matrix.unit) || matrix.unit == 'core' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-${{ matrix.unit }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - if: ${{ contains(fromJSON(needs.plan.outputs.plugins), matrix.unit) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ matrix.unit }}
          path: ${{ runner.temp }}/assets
      - name: Checksums
        if: ${{ !contains(fromJSON(needs.plan.outputs.crates), matrix.unit) || matrix.unit == 'core' }}
        working-directory: ${{ runner.temp }}/assets
        run: |
          shopt -s nullglob
          archives=(*.tar.gz *.tgz)
          if ((${#archives[@]} == 0)); then
            echo "::error::no archives in $PWD to checksum"
            exit 1
          fi
          sha256sum -- "${archives[@]}" >SHA256SUMS
      - if: ${{ !contains(fromJSON(needs.plan.outputs.crates), matrix.unit) || matrix.unit == 'core' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS
      - env:
          UNIT: ${{ matrix.unit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- scripts/release/github-release.sh "$UNIT" "$RUNNER_TEMP/assets"

  charts-index:
    # Step 5, after the tag: the index names the release's asset URLs.
    needs: [plan, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && needs.plan.outputs.charts == 'true' }}
    runs-on: ubuntu-24.04
    environment: release-bot
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: helm-charts
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/helm-charts
          token: ${{ steps.app.outputs.token }}
          path: helm-charts
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install jq helm@4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive-charts-helm
          path: ${{ runner.temp }}/charts
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: mise x helm@4.3.0 -- scripts/release/index-charts.sh "$RUNNER_TEMP/charts" helm-charts

  charts-verify:
    needs: [plan, charts-index]
    if: ${{ !cancelled() && needs.charts-index.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install jq gh helm@4.3.0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x helm@4.3.0 -- scripts/release/verify-charts.sh
      - if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x helm@4.3.0 -- scripts/release/verify-charts.sh --flag

  verify-package:
    needs: [plan, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && needs.plan.outputs.plugins != '[]' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.plugins) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq gh
      - env:
          UNIT: ${{ matrix.unit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- scripts/release/verify-package.sh "$UNIT"
      - if: failure()
        env:
          UNIT: ${{ matrix.unit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- scripts/release/verify-package.sh "$UNIT" --flag

  # Moving tags need a positive verification (I-9): a plugin whose package
  # failed to install and run holds back promotion for the whole run, not
  # just that plugin's image.
  promote-images:
    needs: [plan, github-release, verify-package]
    # A library-only run has no images: an empty matrix is an error.
    if: >-
      ${{ !cancelled() && needs.github-release.result == 'success'
      && (needs.verify-package.result == 'success' || needs.verify-package.result == 'skipped')
      && needs.plan.outputs.images != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq gh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - env:
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- scripts/release/promote-image.sh "$IMAGE"
