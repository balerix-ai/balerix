name: release
# Releases every unit whose manifest version has no tag yet (Spec I §5).
# Merging a release PR is what makes a version untagged, so that is what
# triggers a release; every job is safe to re-run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, test, scan and package everything; publish nothing
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
env:
  # Each job installs only the tools it uses.
  MISE_AUTO_INSTALL: "false"
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      units: ${{ steps.plan.outputs.units }}
      plugins: ${{ steps.plan.outputs.plugins }}
      core: ${{ steps.plan.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq cargo:cargo-audit aqua:EmbarkStudios/cargo-deny
      - id: plan
        run: mise x -- scripts/release/plan.sh >>"$GITHUB_OUTPUT"
      - name: Audit the units being released
        if: steps.plan.outputs.units != '[]'
        env:
          UNITS: ${{ steps.plan.outputs.units }}
        run: |
          mapfile -t units < <(jq -r '.[]' <<<"$UNITS")
          mise x -- scripts/release/audit.sh "${units[@]}"

  build:
    needs: plan
    if: needs.plan.outputs.units != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq
      - id: build
        uses: ./.github/actions/build-binary
        with:
          unit: ${{ matrix.unit }}
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.unit }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.dist }}/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.unit }}-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.dist }}/*
            !${{ steps.build.outputs.dist }}/*.tar.gz
          if-no-files-found: error

  images:
    needs: [plan, build]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq hadolint trivy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.unit }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist
      - if: ${{ !inputs.dry-run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: ./.github/actions/build-image
        with:
          unit: ${{ matrix.unit }}
          dist: ${{ runner.temp }}/dist
          push: ${{ !inputs.dry-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !inputs.dry-run }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.unit }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge-images:
    needs: [plan, images]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq cosign
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.unit }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: merge
        env:
          UNIT: ${{ matrix.unit }}
        run: mise x -- scripts/release/merge-image.sh "$UNIT" "$RUNNER_TEMP/digests" >>"$GITHUB_OUTPUT"
      - name: Sign
        env:
          REF: ${{ steps.merge.outputs.image }}@${{ steps.merge.outputs.digest }}
        run: mise x -- cosign sign --yes --recursive "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.merge.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  package:
    needs: [plan, build]
    if: needs.plan.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-${{ matrix.unit }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - env:
          UNIT: ${{ matrix.unit }}
        run: mise x -- scripts/release/package.sh "$UNIT" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.unit }}
          path: ${{ runner.temp }}/package/*.tar.gz
          if-no-files-found: error

  publish-crates:
    needs: [plan, build]
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq
      - if: ${{ inputs.dry-run || github.repository != 'balerix-ai/balerix' }}
        run: mise x -- scripts/release/publish-crates.sh --dry-run
      - if: ${{ !inputs.dry-run && github.repository == 'balerix-ai/balerix' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - if: ${{ !inputs.dry-run && github.repository == 'balerix-ai/balerix' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: mise x -- scripts/release/publish-crates.sh

  github-release:
    needs: [plan, build, merge-images, package, publish-crates]
    if: >-
      ${{ always() && !inputs.dry-run && needs.plan.outputs.units != '[]'
      && needs.build.result == 'success' && needs.merge-images.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq gh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-${{ matrix.unit }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - if: matrix.unit != 'core'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ matrix.unit }}
          path: ${{ runner.temp }}/assets
      - name: Checksums
        working-directory: ${{ runner.temp }}/assets
        run: sha256sum -- *.tar.gz >SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS
      - env:
          UNIT: ${{ matrix.unit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- scripts/release/github-release.sh "$UNIT" "$RUNNER_TEMP/assets"

  verify-package:
    needs: [plan, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && needs.plan.outputs.plugins != '[]' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.plugins) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq gh
      - env:
          UNIT: ${{ matrix.unit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- scripts/release/verify-package.sh "$UNIT"
      - if: failure()
        env:
          UNIT: ${{ matrix.unit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- scripts/release/verify-package.sh "$UNIT" --flag

  # Moving tags need a positive verification (I-9): a plugin whose package
  # failed to install and run holds back promotion for the whole run, not
  # just that plugin's image.
  promote-images:
    needs: [plan, github-release, verify-package]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && (needs.verify-package.result == 'success' || needs.verify-package.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install: false
          cache: false
      - run: mise install rust jq gh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - env:
          UNIT: ${{ matrix.unit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x -- scripts/release/promote-image.sh "$UNIT"
