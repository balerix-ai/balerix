[package]
name = "balerix-server"
description = "The balerix daemon: fleet registry, reconcile tasks, HTTP API, hook ingress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
balerix-api = { workspace = true }
balerix-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
prometheus = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
serde_norway = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
ureq = { workspace = true }
reqwest = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tracing = { workspace = true }
# `testing.rs` is a library module behind the `testing` feature (the
# integration tests, the daemon's own tests and the binary's tests share
# it): its harness owns temporary directories, and
# `testing::test_authority` issues a throwaway authority and leaf for the
# TLS stub plugin (Spec O §23.1). Neither reaches a release build (#16).
tempfile = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

[features]
# The fake harness (`balerix_server::testing`). Off in release builds.
testing = ["dep:tempfile", "dep:rcgen"]

[dev-dependencies]
# Turns `testing` on for this crate's own unit and integration tests.
balerix-server = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
proptest = { workspace = true }
balerix-plugin-sdk = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
