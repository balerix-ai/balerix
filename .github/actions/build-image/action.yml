name: build-image
description: >-
  Build one image for this runner's architecture from an
  already built binary, smoke-test and scan it, and optionally push it by
  digest (Spec I §6). The caller has checked out the repository, installed
  jq, hadolint and trivy through mise, and logged in to ghcr when pushing.
inputs:
  image:
    description: >-
      Image name from unit_images: balerix, balerix-agent, balerix-operator
      or balerix-plugin-<name>
    required: true
  dist:
    description: Directory holding the unit's bare binaries (build-binary's dist)
    required: true
  push:
    description: "'true' pushes the image by digest after the checks pass"
    required: false
    default: "false"
  github-token:
    description: Token for mise's GitHub downloads inside the build
    required: true
  base-smoke:
    description: >-
      BASE for the smoke build: an image already in this runner's local
      image store (the balerix built earlier in the job). Built with the
      docker driver, the only one that reads the local store.
    required: false
    default: ""
  base-push:
    description: BASE for the push build, a registry reference (the pushed balerix digest; never latest)
    required: false
    default: ""
outputs:
  digest:
    description: The pushed per-architecture digest (empty when not pushing)
    value: ${{ steps.push.outputs.digest }}
  image:
    description: The image repository (ghcr.io/<owner>/<image>)
    value: ${{ steps.context.outputs.image }}
  smoke:
    description: The locally loaded smoke-test tag
    value: ${{ steps.context.outputs.image }}:smoke
runs:
  using: composite
  steps:
    - name: Assemble the build context
      id: context
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIST: ${{ inputs.dist }}
      run: mise x -- scripts/release/image-context.sh "$IMAGE" "$DIST" "$RUNNER_TEMP/image-context-$IMAGE" >>"$GITHUB_OUTPUT"
    - name: Lint the Dockerfile
      shell: bash
      env:
        DOCKERFILE: ${{ steps.context.outputs.dockerfile }}
      run: mise x -- hadolint "$DOCKERFILE"
    - id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ steps.context.outputs.image }}
        # metadata-action defaults title and description to the repository's,
        # which would label every plugin image as balerix.
        labels: |
          org.opencontainers.image.title=${{ steps.context.outputs.title }}
          org.opencontainers.image.description=${{ steps.context.outputs.description }}
          org.opencontainers.image.version=${{ steps.context.outputs.version }}
    - name: Build for the smoke test and scan
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ steps.context.outputs.context }}
        file: ${{ steps.context.outputs.dockerfile }}
        labels: ${{ steps.meta.outputs.labels }}
        builder: ${{ inputs.base-smoke != '' && 'default' || steps.buildx.outputs.name }}
        build-args: ${{ inputs.base-smoke != '' && format('BASE={0}', inputs.base-smoke) || '' }}
        load: true
        tags: ${{ steps.context.outputs.image }}:smoke
        # This build never leaves the runner (the push build below carries
        # the published provenance and SBOM). Without attestation manifests
        # the image survives docker save, docker load and kind load on a
        # containerd image store (a dry run's charts check, #167).
        provenance: false
        sbom: false
        secrets: |
          github_token=${{ inputs.github-token }}
    - name: Smoke test
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image }}
        IMAGE: ${{ steps.context.outputs.image }}
      run: mise x -- scripts/release/smoke-image.sh "$IMAGE_NAME" "$IMAGE:smoke"
    - name: Scan
      shell: bash
      env:
        IMAGE: ${{ steps.context.outputs.image }}
      run: >-
        mise x -- trivy image --exit-code 1 --severity CRITICAL,HIGH
        --ignore-unfixed --no-progress
        --ignorefile "$GITHUB_WORKSPACE/.trivyignore.yaml" "$IMAGE:smoke"
    - name: Push by digest
      id: push
      if: inputs.push == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ steps.context.outputs.context }}
        file: ${{ steps.context.outputs.dockerfile }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.base-push != '' && format('BASE={0}', inputs.base-push) || '' }}
        sbom: true
        provenance: mode=max
        outputs: type=image,name=${{ steps.context.outputs.image }},push-by-digest=true,name-canonical=true,push=true
        secrets: |
          github_token=${{ inputs.github-token }}
