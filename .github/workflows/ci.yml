name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly tier
permissions:
  contents: read
env:
  # `mise run` would otherwise install every missing tool in the [tools] table
  # (two cargo: tools build from source); each job installs only what it needs.
  MISE_AUTO_INSTALL: "false"
jobs:
  # check runs the core workspace, e2e included; BALERIX_REQUIRE_TOOLS makes a missing tool fail.
  check:
    runs-on: ubuntu-latest
    env:
      BALERIX_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { version: 2026.9.2, install: false, cache: true }
      - run: mise install rust cargo:cargo-nextest cargo-insta tmux nono gh gitleaks zizmor actionlint shellcheck hadolint
      # The core workspace, plus the two plugin projects `check` builds for
      # the e2e (`package-plugins flow web`) — without them here, 180 and 179
      # packages compile cold on every run and are thrown away. They share
      # this step rather than getting one of their own: a second
      # Swatinem/rust-cache step means a second ~/.cargo copy against the
      # 10 GB per-repository ceiling the `plugins` job's comment worries
      # about. The cost is that a flow or web lockfile bump now invalidates
      # the core target cache too; both move rarely, and matrix — the
      # expensive project, and what Spec H §7's promise is really about —
      # stays fully independent either way.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            plugins/flow -> target
            plugins/web -> target
      - run: mise run check
  # Each plugin is a standalone project with its own lockfile (Spec H), so
  # each gets its own job and its own cache. They run concurrently with
  # `check`, which no longer lints or tests any of them (it still builds
  # the ones the e2e packages, from their own projects).
  #
  # GitHub evicts least-recently-used cache entries past 10 GB per
  # repository, and five Rust caches can approach that. If eviction starts
  # thrashing, give the plugin jobs `save-if: ${{ github.ref ==
  # 'refs/heads/main' }}` so pull requests restore but do not write.
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [common, flow, web, matrix, github]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { version: 2026.9.2, install: false, cache: true }
      - run: mise install rust cargo:cargo-nextest
      # One cache per plugin project: each has its own lockfile and its own
      # target directory under plugins/<name>/target (scripts/plugin.sh).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "plugins/${{ matrix.plugin }} -> target"
          key: ${{ matrix.plugin }}
      - run: mise run plugin ${{ matrix.plugin }}
  # The agent project (Spec O §12) is standalone like a plugin, with one
  # difference: its two-process tests run the core `balerix` binary, so
  # the job carries the core target cache too and the real tools.
  agent:
    runs-on: ubuntu-latest
    env:
      BALERIX_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { version: 2026.9.2, install: false, cache: true }
      - run: mise install rust cargo:cargo-nextest tmux nono gh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            agent -> target
          key: agent
      - run: mise run agent
  # The operator project (Spec O §12): standalone like the agent, and like it runs the core balerix binary in one test.
  operator:
    runs-on: ubuntu-latest
    env:
      BALERIX_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { version: 2026.9.2, install: false, cache: true }
      # the envtest binaries are the operator task's own tool, which
      # MISE_AUTO_INSTALL=false never installs on its own
      - run: mise install rust cargo:cargo-nextest tmux nono gh github:kubernetes-sigs/controller-tools@envtest-v1.34.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            operator -> target
          key: operator
      - run: mise run operator
  # The charts (Spec O §24.3): helm lint, renderings asserted and dry-run
  # applied on the envtest API server, the controllers as the chart's
  # service account. Path-filtered on pull requests.
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BALERIX_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ $EVENT != pull_request ]]; then echo run=true >>"$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(charts/|operator/|plugins/|scripts/operator\.sh|scripts/kind-up\.sh|mise\.toml|\.github/workflows/ci\.yml)'; then
            echo run=true >>"$GITHUB_OUTPUT"
          else
            echo "nothing the charts depend on changed"; echo run=false >>"$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { version: 2026.9.2, install: false, cache: true }
      - if: steps.changes.outputs.run == 'true'
        run: mise install rust cargo:cargo-nextest helm@4.3.0 github:kubernetes-sigs/controller-tools@envtest-v1.34.1
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            operator -> target
          key: charts
      - if: steps.changes.outputs.run == 'true'
        run: mise run charts
  # The Phase 3 journey on a kind cluster (Spec O §21.4): five builds,
  # five images, one cluster. Path-filtered on pull requests to what
  # can change it; always on main and the nightly.
  e2e-k8s:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BALERIX_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ $EVENT != pull_request ]]; then echo run=true >>"$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(charts/|operator/|agent/|crates/|plugins/|docker/|scripts/kind-up\.sh|scripts/operator\.sh|scripts/release/(image-context|build|lib)\.sh|mise\.toml|Cargo\.(toml|lock)|\.github/workflows/ci\.yml)'; then
            echo run=true >>"$GITHUB_OUTPUT"
          else
            echo "nothing e2e-k8s depends on changed"; echo run=false >>"$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { version: 2026.9.2, install: false, cache: true }
      - if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends musl-tools
          mise install rust jq cargo:cargo-nextest kind@0.33.0 kubectl@1.34.12 helm@4.3.0
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            agent -> target
            operator -> target
            plugins/flow -> target
            plugins/web -> target
          key: e2e-k8s
      - if: steps.changes.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # mise's downloads inside the image build
        run: mise run kind-up
      - if: steps.changes.outputs.run == 'true'
        run: mise run e2e-k8s
      - if: failure() && steps.changes.outputs.run == 'true'
        env:
          KUBECONFIG: target/tmp/kind/kubeconfig
        run: |
          echo "== balerix-system"; kubectl -n balerix-system get deploy,pods -o wide || true
          kubectl -n balerix-system describe pods || true
          kubectl -n balerix-system logs deploy/balerix-operator --tail=-1 || true
          for ns in $(kubectl get ns -o name | sed -n 's|namespace/\(e2e-.*\)|\1|p'); do
            echo "== $ns"; kubectl -n "$ns" get daemons,fleets,crews,agents,plugins,deployments,pods,jobs,pvc -o wide || true
            # the kinds' conditions carry the operator's reasons and messages
            kubectl -n "$ns" get daemons,fleets,crews,agents,plugins -o yaml || true
            kubectl -n "$ns" describe pods || true
            for pod in $(kubectl -n "$ns" get pods -o name); do echo "-- $pod"; kubectl -n "$ns" logs "$pod" --all-containers --prefix || true; done
          done
  mutants:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { version: 2026.9.2, install: false, cache: true }
      - run: mise install rust github:sourcefrog/cargo-mutants
      - run: mise run mutants
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { version: 2026.9.2, install: false, cache: true }
      - run: mise install rust cargo:cargo-audit aqua:EmbarkStudios/cargo-deny
      - run: mise run audit
